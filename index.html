<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2f7; font: 16px Arial, sans-serif; color: #202b3c; }
main { width: min(360px, 92vw); padding: 24px; background: white; border-radius: 18px; box-shadow: 0 8px 32px #23344d18; }
h1 { font-size: 24px; margin: 0 0 20px; }
label { display: block; margin: 12px 0 6px; }
input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
.buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
button { background: #245dcc; color: white; border: 0; border-radius: 8px; padding: 14px; font: inherit; font-size: 23px; cursor: pointer; }
button:hover { background: #1949a7; }
.reset { width: 100%; background: #edf1f6; color: #202b3c; font-size: 16px; margin-top: 12px; }
.reset:hover { background: #dce4ef; }
output { display: block; background: #f1f5f9; padding: 16px; margin-top: 18px; border-radius: 8px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
<h1>Калькулятор</h1>
<label for="a">Первое число</label><input id="a" type="number" step="any" placeholder="Например, 10">
<label for="b">Второе число</label><input id="b" type="number" step="any" placeholder="Например, 5">
<div class="buttons">
<button onclick="calculate('+')" aria-label="Сложить">+</button>
<button onclick="calculate('-')" aria-label="Вычесть">−</button>
<button onclick="calculate('*')" aria-label="Умножить">×</button>
<button onclick="calculate('/')" aria-label="Разделить">÷</button>
</div>
<output id="result" aria-live="polite">Результат: —</output>
<button class="reset" onclick="resetCalculator()">Очистить</button>
</main>
<script>
const a = document.getElementById('a');
const b = document.getElementById('b');
const result = document.getElementById('result');
function calculate(operation) {
  const x = a.valueAsNumber, y = b.valueAsNumber;
  if (!Number.isFinite(x) || !Number.isFinite(y)) { result.textContent = 'Введите два числа'; return; }
  if (operation === '/' && y === 0) { result.textContent = 'На ноль делить нельзя'; return; }
  let answer;
  if (operation === '+') answer = x + y;
  if (operation === '-') answer = x - y;
  if (operation === '*') answer = x * y;
  if (operation === '/') answer = x / y;
  result.textContent = Number.isFinite(answer) ? 'Результат: ' + Number(answer.toPrecision(15)).toLocaleString('ru-RU', {maximumSignificantDigits: 15}) : 'Число слишком большое';
}
function resetCalculator() { a.value = ''; b.value = ''; result.textContent = 'Результат: —'; a.focus(); }
</script>
</body>
</html>
